[package]
name = "kempt-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "10", features = ["serde-compat"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
