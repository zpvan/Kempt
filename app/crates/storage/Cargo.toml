[package]
name = "kempt-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
kempt-core = { path = "../core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
keyring = "3"

[dev-dependencies]
tempfile = "3"
