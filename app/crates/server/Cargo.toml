[package]
name = "kempt-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kempt-server"
path = "src/main.rs"

[dependencies]
kempt-core = { path = "../core" }
kempt-storage = { path = "../storage" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
rust-embed = "8"
mime_guess = "2"
tower-http = { version = "0.6", features = ["limit", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
tempfile = "3"
